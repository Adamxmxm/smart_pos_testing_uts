appId: com.smartpos.smart_pos
env:
  EMAIL: afifadam707@gmail.com        # <-- ganti
  PASSWORD: 12345678         # <-- ganti
---
# ============================================================
# POS E2E - Bayar Tunai
# login -> 3 produk -> keranjang -> ADAM -> qty +1 -> bayar tunai
# -> numpad 150000 -> selesaikan -> cetak nota -> back -> selesai
# ============================================================
- launchApp:
    clearState: true

# ---------- 1. LOGIN ----------
- extendedWaitUntil:
    visible: "Masuk Sekarang"
    timeout: 20000
- tapOn: "nama@domain.com"
- inputText: ${EMAIL}
- tapOn: "••••••••"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Masuk Sekarang"

# ---------- 2. PILIH 3 PRODUK ----------
- extendedWaitUntil:
    visible:
      id: "product_card"
    timeout: 20000

# Produk 1
- tapOn:
    id: "product_card"
    index: 0
- tapOn:
    id: "btn_tambah_ke_keranjang"
- waitForAnimationToEnd

# Produk 2
- tapOn:
    id: "product_card"
    index: 1
- tapOn:
    id: "btn_tambah_ke_keranjang"
- waitForAnimationToEnd

# Produk 3
- tapOn:
    id: "product_card"
    index: 2
- tapOn:
    id: "btn_tambah_ke_keranjang"
- waitForAnimationToEnd

# ---------- 3. BUKA KERANJANG ----------
- tapOn:
    id: "btn_buka_keranjang"
- extendedWaitUntil:
    visible:
      id: "input_nama_pelanggan"
    timeout: 10000

# ---------- 4. NAMA PELANGGAN "ADAM" ----------
- tapOn:
    id: "input_nama_pelanggan"
- inputText: "ADAM"
# PENTING: tutup keyboard dulu. Kalau tidak, keyboard menutupi/menggeser
# tombol bawah dan tap "Bayar Tunai" malah kena "Simpan Tagihan".
- hideKeyboard
- waitForAnimationToEnd

# ---------- 5. QTY +1 (item pertama) ----------
- tapOn:
    id: "btn_qty_tambah_0"
- waitForAnimationToEnd

# ---------- 6. BAYAR TUNAI ----------
# Pastikan tombol Bayar Tunai kelihatan penuh, jangan tap pakai teks
# (teks "Bayar Tunai" berdekatan dengan "Simpan Tagihan"), pakai id.
- scrollUntilVisible:
    element:
      id: "btn_bayar_tunai"
- tapOn:
    id: "btn_bayar_tunai"

# Pastikan dialog pembayaran tunai yang terbuka, BUKAN snackbar simpan tagihan
- extendedWaitUntil:
    visible: "Tunai (Cash)"
    timeout: 10000
- assertNotVisible: "Tagihan berhasil disimpan ke Open Nota!"

# ---------- 7. NUMPAD 150000 ----------
# Tombol C = reset nominal, lalu 1 5 0 000 => 150000
- tapOn:
    id: "numpad_clear"
- tapOn:
    id: "numpad_1"
- tapOn:
    id: "numpad_5"
- tapOn:
    id: "numpad_0"
- tapOn:
    id: "numpad_000"

# ---------- 8. SELESAIKAN PEMBAYARAN TUNAI ----------
- tapOn:
    id: "btn_selesaikan_tunai"

# ---------- 9. CETAK NOTA ----------
- extendedWaitUntil:
    visible:
      id: "btn_cetak_nota"
    timeout: 20000
- tapOn:
    id: "btn_cetak_nota"
- waitForAnimationToEnd:
    timeout: 5000

# ---------- 10. BACK (tutup preview print bawaan sistem) ----------
- back

# ---------- 11. SELESAI (tutup dialog nota) ----------
- extendedWaitUntil:
    visible:
      id: "btn_nota_selesai"
    timeout: 10000
- tapOn:
    id: "btn_nota_selesai"
- waitForAnimationToEnd

# ---------- 12. BACK ----------
- back

# ---------- 13. SELESAI ----------
- assertVisible:
    id: "product_card"
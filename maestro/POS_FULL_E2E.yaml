appId: com.smartpos.smart_pos
env:
  EMAIL: kasir1794230901920@test.com
  PASSWORD: Uji12345!
---
- launchApp

- extendedWaitUntil:
    visible: ".*(Masuk Sekarang|Keranjang|Semua).*"
    timeout: 15000

# ---------- 1. LOGIN (OPSIONAL) ----------
- runFlow:
    when:
      visible: "Masuk Sekarang"
    commands:
      - tapOn: "nama@domain.com"
      - inputText: ${EMAIL}
      - tapOn: "••••••••"
      - inputText: ${PASSWORD}
      - hideKeyboard
      - tapOn: "Masuk Sekarang"

# ---------- 2. PILIH 3 PRODUK ----------
- extendedWaitUntil:
    visible:
      id: "product_card"
    timeout: 20000

# Produk 1
- tapOn:
    id: "product_card"
    index: 0
- tapOn:
    id: "btn_tambah_ke_keranjang"
- waitForAnimationToEnd

# Produk 2
- tapOn:
    id: "product_card"
    index: 1
- tapOn:
    id: "btn_tambah_ke_keranjang"
- waitForAnimationToEnd

# Produk 3
- tapOn:
    id: "product_card"
    index: 2
- tapOn:
    id: "btn_tambah_ke_keranjang"
- waitForAnimationToEnd

# ---------- 3. BUKA KERANJANG ----------
- tapOn:
    id: "btn_buka_keranjang"
- extendedWaitUntil:
    visible:
      id: "input_nama_pelanggan"
    timeout: 10000

# ---------- 4. NAMA PELANGGAN ----------
- tapOn:
    id: "input_nama_pelanggan"
- inputText: "Kak Afif Adam"
- pressKey: Enter
- waitForAnimationToEnd

# ---------- 5. QTY +1 (item pertama) ----------
- tapOn:
    id: "btn_qty_tambah_0"
- waitForAnimationToEnd

# ---------- 6. BAYAR TUNAI ----------
- scrollUntilVisible:
    element:
      id: "btn_bayar_tunai"
- tapOn:
    id: "btn_bayar_tunai"

# Pastikan dialog pembayaran tunai yang terbuka, BUKAN simpan tagihan
- extendedWaitUntil:
    visible: "Tunai (Cash)"
    timeout: 10000
- assertNotVisible: "Tagihan berhasil disimpan ke Open Nota!"

# ---------- 7. NUMPAD 150000 ----------
- tapOn:
    id: "numpad_clear"
- tapOn:
    id: "numpad_1"
- tapOn:
    id: "numpad_5"
- tapOn:
    id: "numpad_0"
- tapOn:
    id: "numpad_000"

# ---------- 8. SELESAIKAN PEMBAYARAN TUNAI ----------
- tapOn:
    id: "btn_selesaikan_tunai"

# ---------- 9. STRUK MUNCUL -> KLIK SELESAI ----------
# Jangan langsung back: dialog struk harus ditutup lewat tombol "Selesai".
- tapOn:
    id: "btn_nota_selesai"
- waitForAnimationToEnd:
    timeout: 5000

# ---------- 10. BACK ----------
- back
- waitForAnimationToEnd
- back

# ---------- 11. NAVIGASI KE LAPORAN ----------
- tapOn: "Laporan.*Tab.*"
- waitForAnimationToEnd

# ---------- 12. CEK TRANSAKSI MASUK & KLIK PRINT ----------
- tapOn:
    point: "86%,84%"
- waitForAnimationToEnd:
    timeout: 5000

# ---------- 13. BACK ----------
- back
- waitForAnimationToEnd

# ---------- 14. SELESAI ----------
- assertVisible: "Laporan.*Tab.*"
appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: PRD-01
# Modul: Tambah Produk (CRUD)
# Deskripsi: Menambahkan produk baru ke sistem POS
# ==============================================================================

# 1. Pindah ke menu Produk (Tab 2)
- tapOn: "Produk"

- extendedWaitUntil:
    visible: "Tambah|Tambah Produk|Produk & Stok"
    timeout: 6000

# 2. Klik tombol 'Tambah' / 'Tambah Produk' di AppBar kanan atas
- tapOn: "Tambah.*"

# 3. Verifikasi dialog formulir terbuka
- extendedWaitUntil:
    visible: "Tambah Produk Baru|Nama Produk"
    timeout: 6000

# 4. Input Nama Produk
- tapOn:
    below: "Nama Produk"
- eraseText: 50
- inputText: "Kopi Arabika UAT"
- hideKeyboard

# 5. Input Harga Jual
- tapOn:
    below: "Harga Jual (Rp)"
- eraseText: 20
- inputText: "25000"
- hideKeyboard

# 6. Input Jumlah Stok
- tapOn:
    below: "Jumlah Stok"
- eraseText: 20
- inputText: "50"
- hideKeyboard

# 7. Klik tombol 'Tambah Produk' untuk submit
- tapOn: "Tambah Produk"

# 8. Verifikasi dialog tertutup dan produk baru muncul di daftar
- extendedWaitUntil:
    visible: "Kopi Arabika UAT"
    timeout: 8000

- assertVisible: "Kopi Arabika UAT"

# 9. Screenshot bukti pengujian CRUD Tambah Produk
- takeScreenshot: "maestro/screenshots/03_crud_tambah_produk.png"

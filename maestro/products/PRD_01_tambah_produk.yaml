appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: PRD-01
# Modul: Tambah Produk
# Deskripsi: Menambahkan produk baru beserta gambar
# Langkah:
#   1. Buka menu Produk -> Klik tombol 'Tambah' / 'Tambah Produk'
#   2. Isi Nama Produk, Kategori, Harga, dan Stok
#   3. Masukkan URL gambar produk (atau pilih foto)
#   4. Klik 'Tambah Produk' untuk menyimpan
# Hasil Diharapkan:
#   Produk baru tersimpan dan langsung muncul di katalog POS dan manajemen produk.
# ==============================================================================

# Pastikan aplikasi aktif dan sudah login
- runFlow: ../common/ensure_logged_in.yaml

# 1. Navigasi ke menu Produk
- tapOn:
    text: ".*Produk.*"

- extendedWaitUntil:
    visible: "Tambah.*|Katalog Produk"
    timeout: 5000

# 2. Klik tombol 'Tambah' / 'Tambah Produk'
- tapOn:
    text: "Tambah.*"

# 3. Verifikasi dialog 'Tambah Produk Baru' terbuka
- extendedWaitUntil:
    visible: "Tambah Produk Baru"
    timeout: 5000

- assertVisible: "Nama Produk"
- assertVisible: "Harga Jual (Rp)"
- assertVisible: "Jumlah Stok"

# 4. Input Nama Produk
- tapOn:
    below: "Nama Produk"
- eraseText: 50
- inputText: "Kopi Arabika UAT"
- hideKeyboard

# 5. Input Harga Jual
- tapOn:
    below: "Harga Jual (Rp)"
- eraseText: 20
- inputText: "25000"
- hideKeyboard

# 6. Input Stok
- tapOn:
    below: "Jumlah Stok"
- eraseText: 20
- inputText: "50"
- hideKeyboard

# 7. Klik tombol 'Tambah Produk'
- tapOn:
    text: "Tambah Produk"

# 8. Verifikasi dialog tertutup dan produk baru muncul
- extendedWaitUntil:
    visible: "Kopi Arabika UAT"
    timeout: 8000

- assertVisible: "Kopi Arabika UAT"

# 9. Dokumentasi hasil eksekusi (Screenshot bukti CRUD produk berhasil)
- takeScreenshot: "maestro/screenshots/03_crud_tambah_produk.png"

appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: PRD-01
# Modul: Tambah Produk
# Deskripsi: Menambahkan produk baru beserta gambar
# Langkah:
#   1. Buka menu Produk -> Klik tombol 'Tambah' / 'Tambah Produk'
#   2. Isi Nama Produk, Kategori, Harga, dan Stok
#   3. Masukkan URL gambar produk (atau pilih foto)
#   4. Klik 'Tambah Produk' untuk menyimpan
# Hasil Diharapkan:
#   Produk baru tersimpan dan langsung muncul di katalog POS dan manajemen produk.
# ==============================================================================

# Pastikan aplikasi aktif dan sudah login
- runFlow: ../common/ensure_logged_in.yaml

# 1. Navigasi ke menu Produk
- tapOn: "Produk"

- extendedWaitUntil:
    visible: "Tambah|Tambah Produk"
    timeout: 5000

# 2. Klik tombol 'Tambah' / 'Tambah Produk'
- tapOn: "Tambah.*"

# 3. Verifikasi dialog 'Tambah Produk Baru' terbuka
- extendedWaitUntil:
    visible: "Tambah Produk Baru"
    timeout: 5000

- assertVisible: "Nama Produk"
- assertVisible: "Harga Jual (Rp)"
- assertVisible: "Jumlah Stok"

# 4. Input Nama Produk
- tapOn: "Contoh: Kopi Susu Gula Aren"
- inputText: "Kopi Arabika UAT"
- hideKeyboard

# 5. Pilih Kategori jika dropdown tersedia
- tapOn:
    text: "Pilih Kategori"
    optional: true

# 6. Input Harga Jual
- tapOn:
    point: "25%,43%" # Posisi input harga
    optional: true
- inputText: "25000"
- hideKeyboard

# 7. Input Stok
- tapOn:
    point: "75%,43%" # Posisi input stok
    optional: true
- inputText: "50"
- hideKeyboard

# 8. Masukkan URL Foto Produk
- tapOn:
    text: "Atau masukkan URL foto (opsional)..."
    optional: true
- inputText: "https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04"
- hideKeyboard

# 9. Klik tombol 'Tambah Produk'
- tapOn: "Tambah Produk"

# 10. Verifikasi dialog tertutup dan produk baru muncul
- extendedWaitUntil:
    visible: "Kopi Arabika UAT"
    timeout: 8000

- assertVisible: "Kopi Arabika UAT"

# 11. Dokumentasi hasil eksekusi (Screenshot bukti CRUD produk berhasil)
- takeScreenshot: "maestro/screenshots/03_crud_tambah_produk.png"

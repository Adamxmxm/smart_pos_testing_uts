appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: PRD-02
# Modul: Edit & Hapus Produk
# Deskripsi: Mengubah data dan menghapus produk dari layar Produk & Stok
# Langkah:
#   1. Navigasi ke tab Produk
#   2. Klik icon edit pada produk pertama
#   3. Ubah stok lalu Simpan Perubahan
#   4. Klik icon hapus pada produk → konfirmasi dialog → Hapus
# Hasil Diharapkan:
#   Data ter-update di Supabase dan produk berhasil dihapus.
# ==============================================================================

# Pastikan aplikasi aktif dan sudah login
- runFlow: ../common/ensure_logged_in.yaml

# 1. Navigasi ke tab Produk (text + koordinat fallback)
- tapOn:
    text: "Produk"
    optional: true
- tapOn:
    point: "37%,96%"
    optional: true

# 2. Tunggu layar Produk & Stok terbuka
- extendedWaitUntil:
    visible: "Produk & Stok|Manajemen Produk"
    timeout: 6000

# AppBar label: mobile = "Produk & Stok", desktop = "Manajemen Produk & Stok"
# Verifikasi tombol Tambah ada di AppBar
- assertVisible: "Tambah|Tambah Produk"

# 3. Klik icon edit (tooltip "Edit Produk") di baris produk pertama
#    — coba via tooltip, lalu fallback koordinat kanan baris pertama
- tapOn:
    text: "Edit Produk"
    optional: true
- runFlow:
    when:
      notVisible: "Edit Produk"
    commands:
      - tapOn:
          point: "84%,22%"

# 4. Tunggu dialog Edit Produk terbuka
- extendedWaitUntil:
    visible: "Edit Produk"
    timeout: 6000

# 5. Ubah stok: tap field Jumlah Stok lalu ganti nilainya
- tapOn:
    below: "Jumlah Stok"
    optional: true
- runFlow:
    when:
      notVisible: "Jumlah Stok"
    commands:
      - tapOn:
          point: "50%,65%"
- eraseText: 5
- inputText: "99"
- hideKeyboard

# 6. Klik tombol Simpan Perubahan
- tapOn: "Simpan Perubahan"

# 7. Tunggu dialog tertutup dan kembali ke daftar produk
- extendedWaitUntil:
    visible: "Tambah|Tambah Produk"
    timeout: 7000

- takeScreenshot: maestro/screenshots/PRD_02a_edit_produk.png

# 8. Klik icon hapus (tooltip "Hapus Produk") di baris produk pertama
- tapOn:
    text: "Hapus Produk"
    optional: true
- runFlow:
    when:
      notVisible: "Hapus Produk?"
    commands:
      - tapOn:
          point: "93%,22%"

# 9. Tunggu dialog konfirmasi hapus muncul
- extendedWaitUntil:
    visible: "Hapus Produk?"
    timeout: 5000

- assertVisible: "Batal"
- assertVisible: "Hapus"

- takeScreenshot: maestro/screenshots/PRD_02b_konfirmasi_hapus.png

# 10. Konfirmasi hapus produk
- tapOn: "Hapus"

# 11. Verifikasi kembali ke daftar produk (snackbar/list refresh)
- extendedWaitUntil:
    visible: "Tambah|Tambah Produk"
    timeout: 7000

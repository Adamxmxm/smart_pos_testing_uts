appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: REP-01
# Modul: Laporan Penjualan
# Deskripsi: Ringkasan penjualan harian/bulanan
# ==============================================================================

# Pastikan aplikasi aktif
- launchApp:
    clearState: false

# 1. Buka menu Laporan
- tapOn: ".*Laporan.*"

- extendedWaitUntil:
    visible: "Total Omset Penjualan|Total Transaksi"
    timeout: 7000

# 2. Verifikasi 3 KPI Cards Utama Penjualan
- assertVisible: "Total Omset Penjualan"
- assertVisible: "Total Transaksi"
- assertVisible: "Rata-rata Keranjang (AOV)"

# 3. Uji interaksi Filter Periode
- tapOn: "Minggu Ini"
- assertVisible: "Total Omset Penjualan"

- tapOn: "Bulan Ini"
- assertVisible: "Total Omset Penjualan"

- tapOn: "Semua Waktu"
- assertVisible: "Total Omset Penjualan"

- tapOn: "Hari Ini"
- assertVisible: "Total Omset Penjualan"

# 4. Verifikasi tombol Export tersedia
- assertVisible: "Export"

# 5. Screenshot hasil
- takeScreenshot: maestro/screenshots/REP_01_laporan_penjualan.png

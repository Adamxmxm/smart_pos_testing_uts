appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: ACC-01
# Modul: Akun & Logout Kasir
# Deskripsi: Verifikasi profil kasir dan proses logout dari aplikasi
# ==============================================================================

# Pastikan aplikasi aktif
- launchApp:
    clearState: false

# 1. Navigasi ke tab Akun
- tapOn: ".*Akun.*"

- extendedWaitUntil:
    visible: "Akun & Profil Kasir|Ringkasan Sesi Operasional"
    timeout: 6000

# 2. Verifikasi komponen profil kasir
- assertVisible: "Ringkasan Sesi Operasional"
- assertVisible: "Versi Aplikasi"

# 3. Scroll ke tombol logout
- scrollUntilVisible:
    element:
      text: "Keluar dari Akun (Logout)"
    direction: DOWN
    timeout: 4000

# 4. Klik tombol logout
- tapOn: "Keluar dari Akun (Logout)"

# 5. Verifikasi dialog konfirmasi logout muncul
- extendedWaitUntil:
    visible: "Keluar Akun Kasir?"
    timeout: 5000

- assertVisible: "Batal"
- assertVisible: "Ya, Keluar"

# 6. Screenshot dialog konfirmasi
- takeScreenshot: maestro/screenshots/ACC_01_logout_dialog.png

# 7. BATALKAN logout agar sesi tetap login
- tapOn: "Batal"

# 8. Verifikasi kembali ke layar Akun
- extendedWaitUntil:
    visible: "Keluar dari Akun (Logout)"
    timeout: 5000

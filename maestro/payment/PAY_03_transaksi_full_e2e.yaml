appId: com.smartpos.smart_pos
---
# ==============================================================================
# MASTER E2E TEST: TOKAPOS - TRANSAKSI PENJUALAN KASIR END-TO-END
# ==============================================================================
# Skenario Lengkap:
#   1. Login kasir & masuk ke tab POS
#   2. Pilih 3 produk dari katalog
#   3. Buka keranjang belanja
#   4. Ketik nama pelanggan "ADAM"
#   5. Klik tombol plus (+) 1 kali untuk menambah kuantitas item
#   6. Klik 'Bayar Tunai'
#   7. Ketik di numpad: 150000 (menghasilkan kembalian)
#   8. Klik 'Selesaikan Pembayaran Tunai'
#   9. Klik 'Cetak Nota'
#  10. Back (tutup print preview sistem)
#  11. Klik 'Selesai' (tutup dialog nota)
#  12. Back
#  13. Selesai (kembali ke POS bersih)
# ==============================================================================

# Pastikan aplikasi aktif di layar
- launchApp:
    clearState: false

# ----------------- 1. LOGIN & PASTIKAN DI TAB POS -----------------
- runFlow:
    when:
      visible: "Masuk ke TokaPOS|Masuk ke Smart POS"
    commands:
      - tapOn:
          below: "Alamat Email"
      - eraseText: 50
      - inputText: "afifadam707@gmail.com"
      - hideKeyboard
      - tapOn:
          below: "Kata Sandi"
      - eraseText: 50
      - inputText: "12345678"
      - hideKeyboard
      - tapOn: "Masuk Sekarang"

- runFlow:
    when:
      notVisible: "Cari produk atau menu..."
    commands:
      - tapOn: ".*POS.*"

- extendedWaitUntil:
    visible: "Cari produk atau menu...|Semua"
    timeout: 8000

# ----------------- 2. PILIH 3 PRODUK KE KERANJANG -----------------
# Produk 1 (Baris 1 Kolom 1)
- tapOn:
    point: "25%,40%"

- extendedWaitUntil:
    visible: "Tambah.*"
    timeout: 5000

- tapOn: "Tambah.*"
- wait: 1200

# Produk 2 (Baris 1 Kolom 2)
- tapOn:
    point: "75%,40%"

- extendedWaitUntil:
    visible: "Tambah.*"
    timeout: 5000

- tapOn: "Tambah.*"
- wait: 1200

# Produk 3 (Baris 2 Kolom 1)
- tapOn:
    point: "25%,70%"

- extendedWaitUntil:
    visible: "Tambah.*"
    timeout: 5000

- tapOn: "Tambah.*"
- wait: 1200

# ----------------- 3. KLIK KERANJANG -----------------
- runFlow:
    when:
      notVisible: "Total Tagihan"
    commands:
      - tapOn:
          text: ".*Item • Rp.*"
          optional: true
      - tapOn:
          point: "85%,5%"
          optional: true

- extendedWaitUntil:
    visible: "Total Tagihan"
    timeout: 7000

# ----------------- 4. KETIK NAMA PELANGGAN "ADAM" -----------------
- tapOn:
    id: "input_nama_pelanggan"
    optional: true
- tapOn:
    text: "Nama Pelanggan / No. Meja (Opsional)"
    optional: true

- eraseText: 30
- inputText: "ADAM"
- hideKeyboard
- wait: 800

# ----------------- 5. KLIK TOMBOL PLUS 1 KALI UNTUK TAMBAH QTY ITEM -----------------
- tapOn:
    id: "btn_qty_tambah_0"
    optional: true
- tapOn:
    text: "Tambah Kuantitas"
    optional: true
- wait: 800

# Screenshot keranjang dengan pelanggan ADAM & qty bertambah
- takeScreenshot: "maestro/screenshots/e2e_01_keranjang_adam.png"

# ----------------- 6. KLIK BAYAR TUNAI -----------------
# Pastikan keyboard tertutup rapat agar tombol tidak tertutup
- hideKeyboard

# Scroll untuk memastikan tombol Bayar Tunai terlihat
- scrollUntilVisible:
    element:
      text: "Bayar Tunai"
    direction: DOWN
    timeout: 3000

- tapOn:
    id: "btn_bayar_tunai"
    optional: true
- tapOn: "Bayar Tunai"

- extendedWaitUntil:
    visible: "Proses Pembayaran|Selesaikan Pembayaran Tunai"
    timeout: 7000

# ----------------- 7. KETIK DI NUMPAD: 150000 -----------------
# Bersihkan dulu dengan tombol 'C'
- tapOn:
    id: "numpad_clear"
    optional: true
- tapOn:
    text: "C"
    optional: true
- wait: 300

# Ketik: 1
- tapOn:
    id: "numpad_1"
    optional: true
- tapOn:
    text: "1"
    optional: true
- wait: 300

# Ketik: 5
- tapOn:
    id: "numpad_5"
    optional: true
- tapOn:
    text: "5"
    optional: true
- wait: 300

# Ketik: 0
- tapOn:
    id: "numpad_0"
    optional: true
- tapOn:
    text: "0"
    optional: true
- wait: 300

# Ketik: 000 (total = 150.000)
- tapOn:
    id: "numpad_000"
    optional: true
- tapOn:
    text: "000"
    optional: true
- wait: 500

# Fallback: jika numpad terlewat, ketik langsung via field uang
- runFlow:
    when:
      notVisible: "150.000|150000"
    commands:
      - tapOn: "Uang Diterima (Rp)"
      - eraseText: 20
      - inputText: "150000"
      - hideKeyboard

- extendedWaitUntil:
    visible: "Kembalian:"
    timeout: 5000

- assertVisible: "Kembalian:"
- takeScreenshot: "maestro/screenshots/e2e_02_pembayaran_150000.png"

# ----------------- 8. KLIK SELESAIKAN PEMBAYARAN TUNAI -----------------
- tapOn:
    id: "btn_selesaikan_tunai"
    optional: true
- tapOn: "Selesaikan Pembayaran Tunai"

# ----------------- 9. KLIK CETAK NOTA -----------------
- extendedWaitUntil:
    visible: "Nota Transaksi"
    timeout: 10000

- assertVisible: "Cetak Nota"
- assertVisible: "Selesai"
- takeScreenshot: "maestro/screenshots/e2e_03_nota_transaksi.png"

- tapOn:
    id: "btn_cetak_nota"
    optional: true
- tapOn: "Cetak Nota"
- wait: 1500

# ----------------- 10. BACK -----------------
- back
- wait: 1000

# ----------------- 11. KLIK SELESAI -----------------
- tapOn:
    id: "btn_nota_selesai"
    optional: true
- tapOn: "Selesai"
- wait: 1000

# ----------------- 12. BACK -----------------
- back
- wait: 1000

# ----------------- 13. SELESAI -----------------
- extendedWaitUntil:
    visible: "Cari produk atau menu...|Semua"
    timeout: 6000

- assertVisible: "Semua"
- takeScreenshot: "maestro/screenshots/e2e_04_selesai.png"

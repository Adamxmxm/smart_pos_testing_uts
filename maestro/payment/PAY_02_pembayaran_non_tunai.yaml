appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: PAY-02
# Modul: Pembayaran Non-Tunai
# Deskripsi: Skenario checkout QRIS / EDC / Transfer
# Langkah:
#   1. Pastikan item ada di keranjang (tambahkan item)
#   2. Klik 'Non-Tunai'
#   3. Pilih metode Non-Tunai (QRIS / EDC / Transfer)
#   4. Konfirmasi pembayaran lunas
# Hasil Diharapkan:
#   Status transaksi berubah menjadi 'completed' tanpa kalkulasi kembalian,
#   dialog 'Nota Transaksi' (Receipt Preview) muncul.
# ==============================================================================

# Pastikan aplikasi aktif dan di halaman POS
- runFlow: ../common/ensure_logged_in.yaml

# 1. Tambah produk ke keranjang belanja
- tapOn:
    text: "Stok:.*|Rp.*"

- extendedWaitUntil:
    visible: "Tambah.*"
    timeout: 5000

- tapOn:
    text: "Tambah.*"

# 2. Buka keranjang belanja jika di mobile
- runFlow:
    when:
      notVisible: "Total Tagihan"
    commands:
      - tapOn:
          text: ".*Item • Rp.*"
          optional: true
      - tapOn:
          text: "Keranjang.*"
          optional: true
      - tapOn:
          point: "85%,5%"
          optional: true

# 3. Verifikasi keranjang dan klik tombol 'Non-Tunai'
- extendedWaitUntil:
    visible: "Total Tagihan|Non-Tunai"
    timeout: 6000

- tapOn: "Non-Tunai"

# 4. Verifikasi modal Proses Pembayaran terbuka pada tab Non-Tunai
- extendedWaitUntil:
    visible: "Proses Pembayaran|Non-Tunai|QRIS"
    timeout: 5000

- assertVisible: "Non-Tunai"

# 5. Pilih metode pembayaran: QRIS (default) atau Mesin EDC
- tapOn:
    text: "QRIS"
    optional: true

# 6. Klik tombol konfirmasi pembayaran non-tunai
- tapOn: "Konfirmasi Bayar.*"

# 7. Verifikasi transaksi 'completed' dan dialog 'Nota Transaksi' muncul
- extendedWaitUntil:
    visible: "Nota Transaksi|Cetak Nota"
    timeout: 10000

- assertVisible: "Cetak Nota"
- assertVisible: "Selesai"

# 8. Tutup dialog nota
- tapOn: "Selesai"

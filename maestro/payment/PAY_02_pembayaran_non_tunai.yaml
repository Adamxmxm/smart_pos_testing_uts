appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: PAY-02
# Modul: Pembayaran Non-Tunai (QRIS / EDC)
# Deskripsi: Alur checkout transaksi kasir non-tunai
# ==============================================================================

# 1. Pastikan di tab POS
- runFlow:
    when:
      notVisible: "Cari produk atau menu..."
    commands:
      - tapOn: "POS"

- extendedWaitUntil:
    visible: "Cari produk atau menu...|Semua"
    timeout: 8000

# 2. Tap kartu produk di katalog
- tapOn:
    text: "Stok:.*|Rp.*"

# 3. Tunggu modal tambah produk dan klik tombol 'Tambah (...)'
- extendedWaitUntil:
    visible: "Tambah.*"
    timeout: 5000

- tapOn: "Tambah.*"

# 4. Buka keranjang belanja jika di mobile
- runFlow:
    when:
      notVisible: "Non-Tunai"
    commands:
      - tapOn:
          text: ".*Item • Rp.*"

# 5. Tunggu keranjang terbuka & klik 'Non-Tunai'
- extendedWaitUntil:
    visible: "Non-Tunai|Total Tagihan"
    timeout: 7000

- assertVisible: "Total Tagihan"

- tapOn: "Non-Tunai"

# 6. Verifikasi dialog Proses Pembayaran terbuka pada tab Non-Tunai
- extendedWaitUntil:
    visible: "Proses Pembayaran|QRIS|Mesin EDC"
    timeout: 7000

# 7. Pilih metode QRIS
- tapOn: "QRIS"

# 8. Klik tombol konfirmasi pembayaran non-tunai
- tapOn: "Konfirmasi Bayar.*"

# 9. Verifikasi dialog Nota Transaksi muncul
- extendedWaitUntil:
    visible: "Nota Transaksi|Cetak Nota|Selesai"
    timeout: 10000

- assertVisible: "Cetak Nota"
- assertVisible: "Selesai"

# 10. Screenshot bukti transaksi non-tunai sukses
- takeScreenshot: maestro/screenshots/PAY_02_non_tunai_sukses.png

# 11. Tutup dialog nota
- tapOn: "Selesai"

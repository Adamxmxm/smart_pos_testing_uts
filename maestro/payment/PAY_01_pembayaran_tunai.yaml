appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: PAY-01
# Modul: Pembayaran Tunai
# Deskripsi: Skenario checkout pembayaran cash/tunai
# Langkah:
#   1. Pastikan item ada di keranjang (tambahkan item jika belum ada)
#   2. Klik 'Bayar Tunai'
#   3. Input nominal uang / pilih tombol 'Uang Pas'
#   4. Konfirmasi 'Selesaikan Pembayaran Tunai'
# Hasil Diharapkan:
#   Aplikasi menampilkan nominal kembalian dengan benar, transaksi 'completed',
#   dan dialog 'Nota Transaksi' (Receipt Preview) muncul.
# ==============================================================================

# Pastikan aplikasi aktif dan di halaman POS
- runFlow: ../common/ensure_logged_in.yaml

# 1. Tambah produk ke keranjang belanja
# Tap kartu produk pertama (berdasarkan label Stok atau Harga)
- tapOn:
    text: "Stok:.*|Rp.*"

# Tunggu dialog AddToCart muncul lalu tap tombol 'Tambah (...)'
- extendedWaitUntil:
    visible: "Tambah.*"
    timeout: 5000

- tapOn:
    text: "Tambah.*"

# 2. Buka keranjang belanja (jika di smartphone tampilan mobile)
- runFlow:
    when:
      notVisible: "Total Tagihan"
    commands:
      - tapOn:
          text: ".*Item • Rp.*"
          optional: true
      - tapOn:
          text: "Keranjang.*"
          optional: true
      - tapOn:
          point: "85%,5%"
          optional: true

# 3. Verifikasi keranjang dan klik tombol 'Bayar Tunai'
- extendedWaitUntil:
    visible: "Total Tagihan|Bayar Tunai"
    timeout: 6000

- tapOn: "Bayar Tunai"

# 4. Verifikasi modal Proses Pembayaran terbuka pada tab Tunai
- extendedWaitUntil:
    visible: "Proses Pembayaran|Tunai (Cash)|Uang Pas"
    timeout: 5000

# 5. Pilih tombol preset 'Uang Pas'
- tapOn: "Uang Pas"

# 6. Selesaikan pembayaran tunai
- tapOn: "Selesaikan Pembayaran Tunai"

# 7. Verifikasi transaksi 'completed' dan dialog 'Nota Transaksi' muncul
- extendedWaitUntil:
    visible: "Nota Transaksi|Cetak Nota"
    timeout: 10000

- assertVisible: "Cetak Nota"
- assertVisible: "Selesai"

# 8. Dokumentasi hasil eksekusi (Screenshot bukti transaksi selesai)
- takeScreenshot: "maestro/screenshots/03_transaksi_tunai_sukses.png"

# 9. Tutup dialog nota
- tapOn: "Selesai"

appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: PAY-01
# Modul: Pembayaran Tunai (Transaksi)
# Deskripsi: Alur checkout transaksi kasir pembayaran tunai hingga cetak nota
# ==============================================================================

# 1. Pastikan berada di layar katalog POS (Tab 1)
- tapOn:
    text: ".*POS.*"
    optional: true
- tapOn:
    point: "12%,96%"
    optional: true

- extendedWaitUntil:
    visible: "Cari produk.*|Semua|SMART POS"
    timeout: 8000

# 2. Tap kartu produk pertama di katalog
- tapOn:
    text: "Stok:.*|Rp.*"
    optional: true
- tapOn:
    point: "25%,35%"
    optional: true

# 3. Tunggu modal tambah produk dan klik tombol 'Tambah (...)'
- extendedWaitUntil:
    visible: "Tambah.*"
    timeout: 5000

- tapOn:
    text: "Tambah.*"
    optional: true
- tapOn:
    point: "50%,92%"
    optional: true

# 4. Buka keranjang belanja jika di smartphone
- runFlow:
    when:
      notVisible: "Bayar Tunai"
    commands:
      - tapOn:
          text: ".*Item • Rp.*"
          optional: true
      - tapOn:
          point: "75%,88%"
          optional: true
      - tapOn:
          point: "85%,7%"
          optional: true

# 5. Verifikasi keranjang dan klik tombol 'Bayar Tunai'
- extendedWaitUntil:
    visible: "Bayar Tunai|Total Tagihan|Keranjang"
    timeout: 6000

- tapOn:
    text: "Bayar Tunai"
    optional: true
- tapOn:
    point: "35%,95%"
    optional: true

# 6. Verifikasi dialog Proses Pembayaran terbuka
- extendedWaitUntil:
    visible: "Proses Pembayaran|Selesaikan Pembayaran Tunai|Uang Pas"
    timeout: 6000

# 7. Pilih tombol preset 'Uang Pas' lalu klik 'Selesaikan Pembayaran Tunai'
- tapOn:
    text: "Uang Pas"
    optional: true

- tapOn:
    text: "Selesaikan Pembayaran Tunai"
    optional: true
- tapOn:
    point: "50%,92%"
    optional: true

# 8. Verifikasi transaksi 'completed' dan dialog Nota Transaksi muncul
- extendedWaitUntil:
    visible: "Nota Transaksi|Cetak Nota|Selesai"
    timeout: 10000

- assertVisible: "Cetak Nota|Selesai"

# 9. Screenshot bukti transaksi selesai
- takeScreenshot: "maestro/screenshots/03_transaksi_tunai_sukses.png"

# 10. Tutup dialog nota (klik 'Selesai')
- tapOn:
    text: "Selesai"
    optional: true
- tapOn:
    point: "25%,94%"
    optional: true

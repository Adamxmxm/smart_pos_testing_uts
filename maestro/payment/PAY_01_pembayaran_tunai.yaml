appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: PAY-01
# Modul: Pembayaran Tunai
# Deskripsi: Skenario checkout pembayaran cash/tunai
# Langkah:
#   1. Pastikan item ada di keranjang (tambahkan item jika belum ada)
#   2. Klik 'Bayar Tunai'
#   3. Input nominal uang / pilih tombol 'Uang Pas'
#   4. Konfirmasi 'Selesaikan Pembayaran Tunai'
# Hasil Diharapkan:
#   Aplikasi menampilkan nominal kembalian dengan benar, transaksi 'completed',
#   dan dialog 'Nota Transaksi' (Receipt Preview) muncul.
# ==============================================================================

# Pastikan aplikasi aktif dan di halaman POS
- runFlow: ../common/ensure_logged_in.yaml
- tapOn: "POS"

# 1. Tambah produk ke keranjang
- tapOn:
    point: "25%,35%"

- extendedWaitUntil:
    visible: "Subtotal Produk"
    timeout: 5000

- tapOn: "Tambah.*"

# 2. Buka keranjang belanja jika di mobile
- runFlow:
    when:
      notVisible: "Total Tagihan"
    commands:
      - tapOn:
          text: ".*Item • Rp.*"
          optional: true
      - tapOn:
          point: "85%,5%"
          optional: true

- extendedWaitUntil:
    visible: "Total Tagihan"
    timeout: 5000

# 3. Klik tombol 'Bayar Tunai'
- tapOn: "Bayar Tunai"

# 4. Verifikasi modal Proses Pembayaran terbuka pada tab Tunai
- extendedWaitUntil:
    visible: "Proses Pembayaran"
    timeout: 5000

- assertVisible: "Total Tagihan"
- assertVisible: "Tunai (Cash)"

# 5. Pilih tombol preset 'Uang Pas'
- tapOn: "Uang Pas"

# 6. Verifikasi kembalian tampil dengan benar
- assertVisible: "Kembalian:"

# 7. Selesaikan pembayaran tunai
- tapOn: "Selesaikan Pembayaran Tunai"

# 8. Verifikasi transaksi 'completed' dan dialog 'Nota Transaksi' muncul
- extendedWaitUntil:
    visible: "Nota Transaksi"
    timeout: 10000

- assertVisible: "Cetak Nota"
- assertVisible: "Selesai"

# 9. Dokumentasi hasil eksekusi (Screenshot bukti transaksi selesai)
- takeScreenshot: "maestro/screenshots/03_transaksi_tunai_sukses.png"

# 10. Tutup dialog nota
- tapOn: "Selesai"

appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: PAY-01
# Modul: Pembayaran Tunai (Transaksi)
# Deskripsi: Alur checkout transaksi kasir pembayaran tunai hingga cetak nota
# ==============================================================================

# 1. Pastikan di tab POS
- runFlow:
    when:
      notVisible: "Cari produk atau menu..."
    commands:
      - tapOn: "POS"

- extendedWaitUntil:
    visible: "Cari produk atau menu...|Semua"
    timeout: 8000

# 2. Tap kartu produk di katalog
- tapOn:
    text: "Stok:.*|Rp.*"

# 3. Tunggu modal tambah produk dan klik tombol 'Tambah (...)'
- extendedWaitUntil:
    visible: "Tambah.*"
    timeout: 5000

- tapOn: "Tambah.*"

# 4. Buka keranjang belanja jika di mobile (tap tombol floating keranjang)
- runFlow:
    when:
      notVisible: "Bayar Tunai"
    commands:
      - tapOn:
          text: ".*Item • Rp.*"

# 5. Tunggu bottom sheet / cart panel terbuka
- extendedWaitUntil:
    visible: "Bayar Tunai|Total Tagihan"
    timeout: 7000

- assertVisible: "Total Tagihan"

# 6. Klik tombol 'Bayar Tunai'
- tapOn: "Bayar Tunai"

# 7. Verifikasi dialog Proses Pembayaran terbuka
- extendedWaitUntil:
    visible: "Proses Pembayaran|Selesaikan Pembayaran Tunai"
    timeout: 7000

# 8. Pilih preset 'Uang Pas' lalu klik 'Selesaikan Pembayaran Tunai'
- tapOn: "Uang Pas"

- tapOn: "Selesaikan Pembayaran Tunai"

# 9. Verifikasi dialog Nota Transaksi muncul
- extendedWaitUntil:
    visible: "Nota Transaksi|Cetak Nota|Selesai"
    timeout: 10000

- assertVisible: "Cetak Nota"
- assertVisible: "Selesai"

# 10. Screenshot bukti transaksi selesai
- takeScreenshot: maestro/screenshots/PAY_01_tunai_sukses.png

# 11. Tutup dialog nota
- tapOn: "Selesai"

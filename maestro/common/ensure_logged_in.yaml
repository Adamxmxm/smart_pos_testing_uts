appId: com.smartpos.smart_pos
---
# ==============================================================================
# Helper Flow: Ensure Cashier Is Logged In & on POS Screen
# ==============================================================================

# Jika sedang di layar login, lakukan proses login kasir
- runFlow:
    when:
      visible: "Masuk ke TokaPOS|Masuk ke Smart POS"
    commands:
      - tapOn:
          below: "Alamat Email"
      - eraseText: 50
      - inputText: "afifadam707@gmail.com"
      - hideKeyboard

      - tapOn:
          below: "Kata Sandi"
      - eraseText: 50
      - inputText: "12345678"
      - hideKeyboard

      - tapOn: "Masuk Sekarang"

# Jika sedang di tab lain (Produk/Laporan/Akun), kembali ke tab POS
- runFlow:
    when:
      notVisible: "Cari produk atau menu..."
    commands:
      - tapOn: ".*POS.*"

# Tunggu sampai katalog POS siap
- extendedWaitUntil:
    visible: "Cari produk atau menu...|Semua"
    timeout: 8000

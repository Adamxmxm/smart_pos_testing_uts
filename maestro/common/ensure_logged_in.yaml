appId: com.smartpos.smart_pos
---
# ==============================================================================
# Helper Flow: Ensure Cashier Is Logged In & Ready on POS Screen
# ==============================================================================

# 1. Cek apakah sudah berada di layar utama POS. Jika sudah, tidak perlu restart app.
- runFlow:
    when:
      notVisible: "Cari produk atau menu..."
    commands:
      # Jika aplikasi belum terbuka sama sekali, jalankan aplikasi
      - runFlow:
          when:
            notVisible: "Masuk ke Smart POS"
          commands:
            - launchApp:
                clearState: false
            - extendedWaitUntil:
                visible: "Masuk ke Smart POS|Cari produk atau menu...|SMART POS"
                timeout: 10000

      # Jika berada di layar login, lakukan login dengan akun kasir
      - runFlow:
          when:
            visible: "Masuk ke Smart POS"
          commands:
            - tapOn:
                below: "Alamat Email"
            - eraseText: 50
            - inputText: ${EMAIL:-"afifadam707@gmail.com"}
            - hideKeyboard

            - tapOn:
                below: "Kata Sandi"
            - eraseText: 50
            - inputText: ${PASSWORD:-"12345678"}
            - hideKeyboard

            - tapOn: "Masuk Sekarang"

      # Jika aplikasi sudah login tapi sedang berada di tab lain (Akun/Laporan/Produk), kembalikan ke tab POS
      - runFlow:
          when:
            visible: "POS"
          commands:
            - tapOn:
                text: "POS"
                optional: true

# 2. Pastikan layar utama POS sudah aktif dan siap digunakan
- extendedWaitUntil:
    visible: "Cari produk atau menu...|Semua"
    timeout: 10000

appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: NAV-01
# Modul: Navigation Bar
# Deskripsi: Navigasi antar modul utama aplikasi
# ==============================================================================

# 1. Navigasi ke menu Produk (Tab 2)
- tapOn:
    text: ".*Produk.*"
    optional: true
- tapOn:
    point: "37%,96%"
    optional: true

# Verifikasi halaman Produk terbuka
- extendedWaitUntil:
    visible: "Tambah.*|Katalog Produk|Produk & Stok|Cari produk.*"
    timeout: 6000
- assertVisible: "Tambah.*|Produk.*|Cari produk.*"

# 2. Navigasi ke menu Laporan (Tab 3)
- tapOn:
    text: ".*Laporan.*"
    optional: true
- tapOn:
    point: "62%,96%"
    optional: true

# Verifikasi halaman Laporan terbuka
- extendedWaitUntil:
    visible: "Laporan.*|Total Omset.*|Total Transaksi|Hari Ini"
    timeout: 6000
- assertVisible: "Total Omset.*|Total Transaksi|Hari Ini"

# 3. Navigasi ke menu Akun (Tab 4)
- tapOn:
    text: ".*Akun.*"
    optional: true
- tapOn:
    point: "87%,96%"
    optional: true

# Verifikasi halaman Akun terbuka
- extendedWaitUntil:
    visible: "Akun.*|Keluar.*|Ringkasan Sesi.*"
    timeout: 6000
- assertVisible: "Keluar.*|Ringkasan Sesi.*"

# 4. Navigasi kembali ke menu POS (Tab 1)
- tapOn:
    text: ".*POS.*"
    optional: true
- tapOn:
    point: "12%,96%"
    optional: true

# Verifikasi kembali ke halaman POS
- extendedWaitUntil:
    visible: "Cari produk.*|Semua|SMART POS"
    timeout: 6000
- assertVisible: "Semua|Cari produk.*"

# 5. Screenshot bukti pengujian navigasi
- takeScreenshot: "maestro/screenshots/02_navigation_pos.png"

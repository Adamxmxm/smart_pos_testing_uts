appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: NAV-01
# Modul: Navigation Bar
# Deskripsi: Navigasi antar modul utama aplikasi
# ==============================================================================

# 1. Navigasi ke menu Produk (Tab 2)
- tapOn: "Produk"

# Verifikasi halaman Produk & Stok terbuka
- extendedWaitUntil:
    visible: "Produk & Stok|Manajemen Produk|Tambah"
    timeout: 6000

- assertVisible: "Tambah|Tambah Produk"

# 2. Navigasi ke menu Laporan (Tab 3)
- tapOn: "Laporan"

# Verifikasi halaman Laporan terbuka
- extendedWaitUntil:
    visible: "Total Omset Penjualan|Total Transaksi"
    timeout: 6000

- assertVisible: "Total Omset Penjualan"
- assertVisible: "Total Transaksi"

# 3. Navigasi ke menu Akun (Tab 4)
- tapOn: "Akun"

# Verifikasi halaman Akun terbuka
- extendedWaitUntil:
    visible: "Akun & Profil Kasir|Ringkasan Sesi Operasional"
    timeout: 6000

- assertVisible: "Ringkasan Sesi Operasional"

# 4. Navigasi kembali ke menu POS (Tab 1)
- tapOn: "POS"

# Verifikasi kembali ke halaman POS
- extendedWaitUntil:
    visible: "Cari produk atau menu...|Semua"
    timeout: 6000

- assertVisible: "Semua"

# 5. Screenshot bukti pengujian navigasi
- takeScreenshot: "maestro/screenshots/02_navigation_pos.png"

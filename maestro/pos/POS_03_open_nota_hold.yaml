appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: POS-03
# Modul: Open Nota (Hold)
# Deskripsi: Menyimpan keranjang transaksi sementara
# Langkah:
#   1. Masukkan item ke keranjang belanja
#   2. Buka keranjang belanja
#   3. Masukkan Nama Pelanggan / No Meja
#   4. Klik 'Simpan Tagihan (Open Nota)'
# Hasil Diharapkan:
#   Order tersimpan dengan status 'open_nota', keranjang kembali kosong.
# ==============================================================================

# Pastikan aplikasi aktif dan di halaman POS
- runFlow: ../common/ensure_logged_in.yaml

# 1. Tambah produk ke keranjang
- tapOn:
    point: "25%,35%"

- extendedWaitUntil:
    visible: "Subtotal Produk"
    timeout: 5000

- tapOn: "Tambah.*"

# 2. Buka keranjang belanja (pada mobile buka via FAB / AppBar)
- runFlow:
    when:
      notVisible: "Total Tagihan"
    commands:
      - tapOn:
          text: ".*Item • Rp.*"
          optional: true
      - tapOn:
          point: "85%,5%"
          optional: true

- extendedWaitUntil:
    visible: "Keranjang"
    timeout: 5000

# 3. Input Nama Pelanggan / Nomor Meja
- tapOn: "Nama Pelanggan / No. Meja (Opsional)"
- inputText: "Meja 12 - Pak Budi"
- hideKeyboard

# 4. Klik tombol 'Simpan Tagihan (Open Nota)'
- tapOn: "Simpan Tagihan (Open Nota)"

# 5. Verifikasi notifikasi berhasil dan keranjang kembali kosong
- extendedWaitUntil:
    visible: "Tagihan berhasil disimpan ke Open Nota!"
    timeout: 6000

# Jika di mobile bottom sheet ditutup otomatis, verifikasi keranjang kosong
- runFlow:
    when:
      visible: "Keranjang belanja kosong"
    commands:
      - assertVisible: "Keranjang belanja kosong"

appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: AUTH-03
# Modul: Login Kasir
# Deskripsi: Login menggunakan email & password yang terdaftar
# ==============================================================================

# 1. Buka aplikasi POS
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Masuk ke TokaPOS|Masuk ke Smart POS"
    timeout: 8000

# 2. Input Email Kasir
- tapOn:
    below: "Alamat Email"
- eraseText: 50
- inputText: "afifadam707@gmail.com"
- hideKeyboard

# 3. Input Password
- tapOn:
    below: "Kata Sandi"
- eraseText: 50
- inputText: "12345678"
- hideKeyboard

# 4. Klik tombol 'Masuk Sekarang'
- tapOn: "Masuk Sekarang"

# 5. Verifikasi berhasil masuk ke halaman utama POS
- extendedWaitUntil:
    visible: "TokaPOS|SMART POS|Cari produk atau menu..."
    timeout: 10000

- assertVisible: "Cari produk atau menu..."
- assertVisible: "Semua"

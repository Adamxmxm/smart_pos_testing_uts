appId: com.smartpos.smart_pos
env:
  EMAIL: kasir1794230901920@test.com
  PASSWORD: Uji12345!
  NAMA_PRODUK: "Milo Dinosaur"
  HARGA_AWAL: "15000"
  HARGA_BARU: "25000"
  STOK_AWAL: "50"
  STOK_BARU: "75"
---

- launchApp:
    clearState: false

# Splash screen check
- extendedWaitUntil:
    visible: ".*(Masuk Sekarang|Keranjang|Semua|Produk).*"
    timeout: 15000

# ---------- LOGIN (JIKA BELUM LOGIN) ----------
- runFlow:
    when:
      visible: "Masuk Sekarang|Masuk ke TokaPOS|Masuk ke Smart POS"
    commands:
      - tapOn:
          text: "nama@domain.com"
          optional: true
      - tapOn:
          below: "Alamat Email"
          optional: true
      - eraseText: 50
      - inputText: ${EMAIL}
      - hideKeyboard

      - tapOn:
          text: "••••••••"
          optional: true
      - tapOn:
          below: "Kata Sandi"
          optional: true
      - eraseText: 50
      - inputText: ${PASSWORD}
      - hideKeyboard

      - tapOn: "Masuk Sekarang"

# ---------- BUKA MENU PRODUK (TAB 2) ----------
- extendedWaitUntil:
    visible: ".*Produk.*"
    timeout: 15000

# Navbar Flutter sering punya teks semantik tambahan (mis. "Produk\nTab 2 of 4"),
# jadi pakai "Produk.*" (diawali Produk, tidak cocok dengan "Cari produk...")
- tapOn:
    text: "Produk.*"
    optional: true

# Fallback: tap koordinat tab ke-2 dari 4 di navbar bawah
- runFlow:
    when:
      notVisible: "Produk & Stok|Tambah"
    commands:
      - tapOn:
          point: "37%,95%"

- extendedWaitUntil:
    visible: "Produk & Stok|Tambah"
    timeout: 10000

# ============================================================
# C - CREATE (TAMBAH PRODUK BARU)
# ============================================================
- tapOn: "Tambah"

- extendedWaitUntil:
    visible: "Tambah Produk Baru|Nama Produk"
    timeout: 10000

# 1. Input Nama Produk
- tapOn: "Contoh: Kopi Susu Gula Aren"
- inputText: ${NAMA_PRODUK}
- hideKeyboard

# 2. Pilih Kategori: Kopi & Minuman
- tapOn: "Pilih Kategori"
- tapOn: "Kopi.*Minuman"

# 3. Input Harga Jual Awal (Rp 15.000)
- tapOn:
    below: "Harga Jual \\(Rp\\)"
    leftOf: "Jumlah Stok"
- eraseText: 10
- inputText: ${HARGA_AWAL}
- hideKeyboard

# 4. Input Jumlah Stok Awal (50)
- tapOn:
    below: "Jumlah Stok"
    rightOf: "Harga Jual \\(Rp\\)"
- eraseText: 10
- inputText: ${STOK_AWAL}
- hideKeyboard

# 5. Upload Foto Pertama dari Galeri (Pilih grid kiri atas)
- scrollUntilVisible:
    element:
      text: ".*Foto.*Galeri.*"
    direction: DOWN
    timeout: 5000

- tapOn: ".*Foto.*Galeri.*"
- waitForAnimationToEnd:
    timeout: 2000

# Pilih foto paling kiri atas di grid photo picker (gambar pertama, bukan tab "Photos")
# Layar 720x1600: gambar pertama berpusat sekitar X=17%, Y=55%
- tapOn:
    point: "17%,55%"
- waitForAnimationToEnd:
    timeout: 1000

# Tombol Done/Selesai di photo picker jika muncul
- tapOn:
    text: "Done|Selesai"
    optional: true
- waitForAnimationToEnd:
    timeout: 1000

# 6. Simpan Produk Baru
- scrollUntilVisible:
    element:
      text: "Tambah Produk"
    direction: DOWN
    timeout: 5000

- tapOn: "Tambah Produk"
- waitForAnimationToEnd:
    timeout: 1500

# ============================================================
# R - READ (CARI & VERIFIKASI PRODUK DITAMBAHKAN)
# ============================================================
- tapOn: "Cari produk berdasarkan nama..."
- eraseText: 30
- inputText: ${NAMA_PRODUK}
- pressKey: Enter

# JANGAN pakai hideKeyboard di sini: kalau keyboard sudah tertutup, Maestro
# kirim tombol Back dan aplikasi ikut tertutup. Cukup tap judul untuk unfocus.
- tapOn:
    text: "Produk & Stok"
    optional: true
- waitForAnimationToEnd:
    timeout: 1000

- extendedWaitUntil:
    visible: ${NAMA_PRODUK}
    timeout: 10000

- assertVisible: ".*Stok: ${STOK_AWAL}.*"

# ============================================================
# U - UPDATE (KLIK EDIT PENSIL -> GANTI HARGA, STOK & FOTO TENGAH)
# ============================================================
- waitForAnimationToEnd:
    timeout: 500

# Klik icon edit (pensil) di kartu produk (hasil search tinggal 1 produk)
# Dari screenshot 369x812: pensil di X~75%, Y~31%
- tapOn:
    point: "75%,31%"

# Pastikan dialog Edit Produk sudah terbuka penuh
- extendedWaitUntil:
    visible: "Simpan Perubahan"
    timeout: 10000

# 1. Edit Harga Jual ke Harga Baru (Rp 20.000)
# Tap di UJUNG KANAN field harga supaya kursor ada di akhir angka.
# (Tap di tengah bikin kursor di tengah "15000", eraseText cuma hapus yang di kiri
#  kursor, sehingga sisa "0" tertinggal -> 200000)
# Dari screenshot dialog Edit Produk: field harga X~12-48%, Y~45%
- tapOn:
    point: "46%,45%"
- eraseText: 10
- inputText: ${HARGA_BARU}
- hideKeyboard

# 2. Edit Jumlah Stok ke Stok Baru (75)
- tapOn:
    below: "Jumlah Stok"
    rightOf: "Harga Jual \\(Rp\\)"
- eraseText: 10
- inputText: ${STOK_BARU}
- hideKeyboard

# 3. Simpan Perubahan
- scrollUntilVisible:
    element:
      text: "Simpan Perubahan"
    direction: DOWN
    timeout: 5000

- tapOn: "Simpan Perubahan"
- waitForAnimationToEnd:
    timeout: 1500

# Verifikasi stok ter-update ke 75
- extendedWaitUntil:
    visible: ".*Stok: ${STOK_BARU}.*"
    timeout: 10000
- assertVisible: ".*Stok: ${STOK_BARU}.*"

# ============================================================
# D - DELETE (HAPUS PRODUK)
# ============================================================
- tapOn:
    text: "Produk & Stok"
    optional: true
- waitForAnimationToEnd:
    timeout: 500

# Klik icon hapus (tong sampah): X~87%, Y~31%
- tapOn:
    point: "87%,31%"

- extendedWaitUntil:
    visible: "Hapus Produk\\?"
    timeout: 10000

# Konfirmasi Hapus
- tapOn: "Hapus"
- waitForAnimationToEnd:
    timeout: 1500

# Verifikasi produk sudah tidak terlihat di daftar
- assertNotVisible: ".*Stok: .*"
- takeScreenshot: "maestro/screenshots/crud_product_selesai"
appId: com.smartpos.smart_pos
---
# ==============================================================================
# UAT Test Case: PRT-02
# Modul: Reprint Struk
# Deskripsi: Cetak ulang struk dari riwayat transaksi di layar Laporan
# Langkah:
#   1. Masuk ke tab Laporan
#   2. Scroll ke 'Riwayat Transaksi Penjualan'
#   3. Tap icon printer di baris transaksi pertama
#   4. Verifikasi dialog 'Nota Transaksi' terbuka → Cetak Nota → Selesai
# Hasil Diharapkan:
#   Dialog nota transaksi terbuka dan tombol Cetak Nota dapat diklik.
# ==============================================================================

# Pastikan aplikasi aktif dan sudah login
- runFlow: ../common/ensure_logged_in.yaml

# 1. Navigasi ke tab Laporan (text + koordinat fallback)
- tapOn:
    text: "Laporan"
    optional: true
- tapOn:
    point: "62%,96%"
    optional: true

# 2. Tunggu layar Laporan terbuka
- extendedWaitUntil:
    visible: "Laporan Penjualan|Laporan & Analitik Penjualan"
    timeout: 7000

# 3. Scroll ke bagian Riwayat Transaksi Penjualan
- scrollUntilVisible:
    element:
      text: "Riwayat Transaksi Penjualan"
    direction: DOWN
    timeout: 5000

- assertVisible: "Riwayat Transaksi Penjualan"

# 4. Pastikan ada transaksi COMPLETED
- extendedWaitUntil:
    visible: "COMPLETED"
    timeout: 5000
    optional: true

# 5. Tap icon printer (tooltip "Cetak Struk Ulang") di baris transaksi pertama
#    Koordinat: pojok kanan baris pertama setelah header riwayat
- tapOn:
    text: "Cetak Struk Ulang"
    optional: true
- runFlow:
    when:
      notVisible: "Nota Transaksi"
    commands:
      - tapOn:
          point: "92%,65%"

# 6. Verifikasi dialog Nota Transaksi terbuka
- extendedWaitUntil:
    visible: "Nota Transaksi"
    timeout: 6000

- assertVisible: "Cetak Nota"
- assertVisible: "Selesai"
- assertVisible: "Ukuran Kertas:"

# 7. Screenshot dialog nota
- takeScreenshot: maestro/screenshots/PRT_02_reprint_struk.png

# 8. Klik Cetak Nota (opsional di emulator tanpa printer)
- tapOn: "Cetak Nota"

# 9. Tutup dialog
- wait: 1500
- tapOn:
    text: "Selesai"
    optional: true
